version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Types should match the oldest supported Node.js version (engines.node)
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint and typedoc don't support TypeScript 7 yet
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
