name: Publish

# Publishes to npm when a GitHub release is published, using npm trusted publishing (no token).
# One-time setup on npmjs.com: package Settings > Trusted Publisher > GitHub Actions, with
# user "AlenVelocity", repository "wa-sticker-formatter" and workflow "publish.yml".
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No registry-url here: it makes setup-node write a token to .npmrc, which npm then uses instead of OIDC
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@latest
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run check
      - run: npm publish --provenance --access public
